project_name: "Wiki_Benchmark"
dataset_name: "paperscope_summary_57_gap_graph_catalog_qa"

adapter:
  module: "src.adapters.paperscope_summary_adapter"
  class_name: "PaperScopeSummaryAdapter"

execution:
  mode: "vikingbot"
  server_port: 2034
  max_workers: 1
  retrieval_topk: 3
  max_queries: null
  skip_ingestion: true
  ingest_mode: "directory"
  build_wiki: false
  wiki_card_input_mode: "summary"
  wiki_max_card_input_chars: 20000
  retrieval_strategy: "cluster_catalog"
  tool_policy: "hard_cap"
  wiki_root_uri: "viking://wiki/paperscope_summary_57_graph_catalog/"
  wiki_retrieval_topk: 5
  original_fallback_topk: 3
  seed_chunk_topk: 8
  catalog_max_nodes: 4
  catalog_docs_per_node: 12
  catalog_max_chars: 18000
  retrieval_instruction: ""

paths:
  dataset_path: "datasets/PaperScopeSummary57/summary_gap.jsonl"
  doc_output_dir: "wiki_storage/paperscope_summary_57/paperscope_summary_57_processed_docs"
  vector_store: "wiki_storage/paperscope_summary_57/paperscope_summary_57_viking_store_index"
  output_dir: "Output/{dataset_name}/wiki"
  log_file: "Output/{dataset_name}/wiki/benchmark.log"

llm:
  model: "${OV_VLM_MODEL}"
  provider: "${OV_VLM_PROVIDER}"
  temperature: 0
  base_url: "${OV_VLM_API_BASE}"
  api_key_env_var: "OV_VLM_API_KEY"
